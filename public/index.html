<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <title>Eleições Brasileiras</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    #grid-impressao { display: none; }
    @media print {
      @page { size: auto; margin: 12mm; }
      header, #grid, #overlay { display: none !important; }
      #grid-impressao { display: block !important; padding: 0; font-family: Arial, Helvetica, sans-serif; }
      .card-impressao {
        display: flex;
        gap: 3mm;
        align-items: center;
        break-inside: avoid;
        page-break-inside: avoid;
        padding: 2mm 0;
        border-bottom: 0.3mm solid #ccc;
      }
      .card-impressao img { width: 18mm; height: 22mm; object-fit: cover; border-radius: 1mm; flex-shrink: 0; }
      .ci-principal { font-size: 10.5pt; font-weight: 700; line-height: 1.25; }
      .ci-secundaria { font-size: 9pt; color: #333; line-height: 1.25; }
    }
  </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 antialiased">
  <header class="sticky top-0 z-10 border-b border-slate-200 bg-slate-50/80 px-6 py-5 backdrop-blur">
    <h1 class="text-xl font-bold tracking-tight text-slate-900">Eleições Brasileiras</h1>

    <div class="mt-4 flex flex-wrap gap-3">
      <label class="flex flex-col gap-1 text-xs font-medium text-slate-500">
        Ano
        <select id="ano" class="rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm text-slate-800 shadow-sm transition-all duration-200 ease-in-out focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500"></select>
      </label>
      <label class="flex flex-col gap-1 text-xs font-medium text-slate-500">
        Estado
        <select id="uf" class="rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm text-slate-800 shadow-sm transition-all duration-200 ease-in-out focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <option value="">Todos</option>
        </select>
      </label>
      <label class="flex flex-col gap-1 text-xs font-medium text-slate-500">
        Cargo
        <div id="cargo" class="flex min-h-[46px] min-w-[190px] flex-wrap items-center gap-1.5 rounded-xl border border-slate-200 bg-white px-2 py-1.5 shadow-sm transition-all duration-200 ease-in-out focus-within:border-indigo-500 focus-within:ring-2 focus-within:ring-indigo-500"></div>
      </label>
      <label class="flex flex-col gap-1 text-xs font-medium text-slate-500">
        Partido
        <div id="partido" class="flex min-h-[46px] min-w-[190px] flex-wrap items-center gap-1.5 rounded-xl border border-slate-200 bg-white px-2 py-1.5 shadow-sm transition-all duration-200 ease-in-out focus-within:border-indigo-500 focus-within:ring-2 focus-within:ring-indigo-500"></div>
      </label>
      <label class="flex flex-col gap-1 text-xs font-medium text-slate-500">
        Grau de instrução
        <div id="instrucao" class="flex min-h-[46px] min-w-[190px] flex-wrap items-center gap-1.5 rounded-xl border border-slate-200 bg-white px-2 py-1.5 shadow-sm transition-all duration-200 ease-in-out focus-within:border-indigo-500 focus-within:ring-2 focus-within:ring-indigo-500"></div>
      </label>
      <label class="flex flex-col gap-1 text-xs font-medium text-slate-500">
        Ocupação
        <div id="ocupacao" class="flex min-h-[46px] min-w-[190px] flex-wrap items-center gap-1.5 rounded-xl border border-slate-200 bg-white px-2 py-1.5 shadow-sm transition-all duration-200 ease-in-out focus-within:border-indigo-500 focus-within:ring-2 focus-within:ring-indigo-500"></div>
      </label>
      <label class="flex flex-col gap-1 text-xs font-medium text-slate-500">
        Naturalidade
        <div id="naturalidade" class="flex min-h-[46px] min-w-[190px] flex-wrap items-center gap-1.5 rounded-xl border border-slate-200 bg-white px-2 py-1.5 shadow-sm transition-all duration-200 ease-in-out focus-within:border-indigo-500 focus-within:ring-2 focus-within:ring-indigo-500"></div>
      </label>
      <label class="flex flex-col gap-1 text-xs font-medium text-slate-500">
        Total de bens
        <div id="bens" class="flex min-h-[46px] min-w-[190px] flex-wrap items-center gap-1.5 rounded-xl border border-slate-200 bg-white px-2 py-1.5 shadow-sm transition-all duration-200 ease-in-out focus-within:border-indigo-500 focus-within:ring-2 focus-within:ring-indigo-500"></div>
      </label>
      <label class="flex flex-1 min-w-[220px] flex-col gap-1 text-xs font-medium text-slate-500">
        Buscar nome
        <input type="search" id="busca" placeholder="nome ou nome de urna" class="rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm text-slate-800 shadow-sm transition-all duration-200 ease-in-out placeholder:text-slate-400 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      </label>
      <label class="flex flex-col gap-1 text-xs font-medium text-slate-500">
        Ordenar
        <select id="ordenar" class="rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm text-slate-800 shadow-sm transition-all duration-200 ease-in-out focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <option value="asc">Nome A-Z</option>
          <option value="desc">Nome Z-A</option>
        </select>
      </label>
      <label class="flex flex-col justify-end gap-1 text-xs font-medium text-slate-500">
        <span class="flex items-center gap-2 px-1 py-3">
          <input type="checkbox" id="somente-favoritos" class="h-4 w-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500" />
          ★ Somente favoritos
        </span>
      </label>
      <div class="flex flex-col justify-end gap-1">
        <span class="select-none text-xs font-medium text-transparent">.</span>
        <button
          id="limpar"
          type="button"
          class="rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm font-medium text-slate-600 shadow-sm transition-all duration-200 ease-in-out hover:border-slate-300 hover:bg-slate-100"
        >
          Limpar filtros
        </button>
      </div>
      <div class="flex flex-col justify-end gap-1">
        <span class="select-none text-xs font-medium text-transparent">.</span>
        <button
          id="imprimir"
          type="button"
          class="rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm font-medium text-slate-600 shadow-sm transition-all duration-200 ease-in-out hover:border-slate-300 hover:bg-slate-100"
        >
          Imprimir / Exportar PDF
        </button>
      </div>
    </div>

    <p id="contador" class="mt-3 text-sm text-slate-500"></p>
  </header>

  <main id="grid" class="grid grid-cols-[repeat(auto-fill,minmax(280px,1fr))] gap-6 p-6"></main>

  <div id="overlay" class="hidden fixed inset-0 z-50 flex items-start justify-center overflow-y-auto bg-slate-900/50 p-4 backdrop-blur-sm sm:p-8">
    <div id="detalhe" class="w-full max-w-lg rounded-2xl border border-slate-100 bg-white p-6 shadow-xl shadow-indigo-500/5 sm:p-8"></div>
  </div>

  <main id="grid-impressao"></main>

  <script src="app.js"></script>
</body>
</html>
