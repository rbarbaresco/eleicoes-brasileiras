<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <title>Eleições Brasileiras</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 antialiased">
  <header class="sticky top-0 z-10 border-b border-slate-200 bg-slate-50/80 px-6 py-5 backdrop-blur">
    <h1 class="text-xl font-bold tracking-tight text-slate-900">Eleições Brasileiras</h1>

    <div class="mt-4 flex flex-wrap gap-3">
      <label class="flex flex-col gap-1 text-xs font-medium text-slate-500">
        Ano
        <select id="ano" class="rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm text-slate-800 shadow-sm transition-all duration-200 ease-in-out focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500"></select>
      </label>
      <label class="flex flex-col gap-1 text-xs font-medium text-slate-500">
        Estado
        <select id="uf" class="rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm text-slate-800 shadow-sm transition-all duration-200 ease-in-out focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <option value="">Todos</option>
        </select>
      </label>
      <label class="flex flex-col gap-1 text-xs font-medium text-slate-500">
        Cargo
        <select id="cargo" class="rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm text-slate-800 shadow-sm transition-all duration-200 ease-in-out focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <option value="">Todos</option>
        </select>
      </label>
      <label class="flex flex-col gap-1 text-xs font-medium text-slate-500">
        Partido
        <select id="partido" class="rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm text-slate-800 shadow-sm transition-all duration-200 ease-in-out focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <option value="">Todos</option>
        </select>
      </label>
      <label class="flex flex-col gap-1 text-xs font-medium text-slate-500">
        Município
        <select id="municipio" class="rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm text-slate-800 shadow-sm transition-all duration-200 ease-in-out focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <option value="">Todos</option>
        </select>
      </label>
      <label class="flex flex-col gap-1 text-xs font-medium text-slate-500">
        Grau de instrução
        <select id="instrucao" class="rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm text-slate-800 shadow-sm transition-all duration-200 ease-in-out focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <option value="">Todos</option>
        </select>
      </label>
      <label class="flex flex-col gap-1 text-xs font-medium text-slate-500">
        Ocupação
        <select id="ocupacao" class="rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm text-slate-800 shadow-sm transition-all duration-200 ease-in-out focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <option value="">Todas</option>
        </select>
      </label>
      <label class="flex flex-col gap-1 text-xs font-medium text-slate-500">
        Naturalidade
        <select id="naturalidade" class="rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm text-slate-800 shadow-sm transition-all duration-200 ease-in-out focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 disabled:cursor-not-allowed disabled:opacity-50">
          <option value="">Todas</option>
        </select>
      </label>
      <label class="flex flex-col gap-1 text-xs font-medium text-slate-500">
        Total de bens
        <select id="bens" class="rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm text-slate-800 shadow-sm transition-all duration-200 ease-in-out focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 disabled:cursor-not-allowed disabled:opacity-50">
          <option value="">Todos</option>
        </select>
      </label>
      <label class="flex flex-1 min-w-[220px] flex-col gap-1 text-xs font-medium text-slate-500">
        Buscar nome
        <input type="search" id="busca" placeholder="nome ou nome de urna" class="rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm text-slate-800 shadow-sm transition-all duration-200 ease-in-out placeholder:text-slate-400 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      </label>
      <label class="flex flex-col gap-1 text-xs font-medium text-slate-500">
        Ordenar
        <select id="ordenar" class="rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm text-slate-800 shadow-sm transition-all duration-200 ease-in-out focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <option value="asc">Nome A-Z</option>
          <option value="desc">Nome Z-A</option>
        </select>
      </label>
    </div>

    <p id="contador" class="mt-3 text-sm text-slate-500"></p>
  </header>

  <main id="grid" class="grid grid-cols-[repeat(auto-fill,minmax(280px,1fr))] gap-6 p-6"></main>

  <div id="overlay" class="hidden fixed inset-0 z-50 flex items-start justify-center overflow-y-auto bg-slate-900/50 p-4 backdrop-blur-sm sm:p-8">
    <div id="detalhe" class="w-full max-w-lg rounded-2xl border border-slate-100 bg-white p-6 shadow-xl shadow-indigo-500/5 sm:p-8"></div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
