name: Deploy to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      ano:
        description: 'Ano da eleição a publicar'
        required: true
        default: '2026'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Baixar dados do TSE
        env:
          ANO: ${{ github.event.inputs.ano }}
        run: |
          node -e "
            require('./src/download')
              .buildYear(Number(process.env.ANO), { completo: true, photos: true })
              .then(() => process.exit(0));
          "

      - name: Montar site estático
        run: |
          mkdir -p dist
          cp -r public/. dist/
          cp -r data dist/data

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
